<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us — Past Curfew</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="past-concerts.html">Past Concerts</a></li>
        <li><a href="about.html">Past Curfew</a></li>
        <li><a href="https://docs.google.com/forms/d/1lAHB9Q22z0LzghLsBAicBit9Tc1oa1Bu08wZsbrwd8w/viewform" target="_blank" rel="noopener noreferrer">Mailing List!</a></li>
        <li><a href="contact.html" aria-current="page">Contact Us!</a></li>
      </ul>
    </nav>
  </header>
  <main class="site-main">
    <h1 class="page-title">Contact Us!</h1>
    <p class="contact-intro">
      Send us a message using this form, or email us directly at
      <a class="contact-email-link" href="mailto:info@pastcurfew.live">info@pastcurfew.live</a>.
    </p>
    <form class="contact-form" id="contact-form">
      <label for="contact-name">Name</label>
      <input id="contact-name" name="Name" type="text" autocomplete="name" required>

      <label for="contact-email">Email Address</label>
      <input id="contact-email" name="Email" type="email" autocomplete="email" required>

      <label for="contact-phone">Phone Number (optional)</label>
      <input id="contact-phone" name="Phone" type="tel" autocomplete="tel">

      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="Message" rows="6" required></textarea>

      <button type="submit">Send Message</button>
    </form>
    <p class="contact-note">Submitting this form opens your email app and drafts the message to info@pastcurfew.live.</p>
  </main>
  <script>
    (function () {
      var form = document.getElementById("contact-form");
      if (!form) return;

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        var name = document.getElementById("contact-name").value.trim();
        var email = document.getElementById("contact-email").value.trim();
        var phone = document.getElementById("contact-phone").value.trim();
        var message = document.getElementById("contact-message").value.trim();

        var subject = "Past Curfew Website Message";
        var bodyLines = [
          "Name: " + name,
          "Email: " + email,
          "Phone: " + (phone || "(not provided)"),
          "",
          "Message:",
          message
        ];

        var mailtoHref =
          "mailto:info@pastcurfew.live" +
          "?subject=" + encodeURIComponent(subject) +
          "&body=" + encodeURIComponent(bodyLines.join("\n"));

        window.location.href = mailtoHref;
      });
    })();
  </script>
</body>
</html>
